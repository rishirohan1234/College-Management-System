
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Management | CampusConnect</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div class="dashboard">

    <aside class="sidebar">
        <h2>CampusConnect</h2>

        <nav>
            <a href="../index.html">Dashboard</a>
            <a href="students.html">Students</a>
            <a href="faculty.html">Faculty</a>
            <a href="courses.html" class="active">Courses</a>
        </nav>
    </aside>

    <main class="main-content">

        <header class="topbar">
            <h1>Course Management</h1>
            <p>Manage college courses</p>
        </header>

        <section class="content">

            <div class="section-header">
                <h2>All Courses</h2>
                <button class="btn-primary" onclick="openCourseForm()">
                    + Add Course
                </button>
            </div>

            <input
                type="text"
                id="searchCourse"
                placeholder="Search courses..."
                onkeyup="searchCourses()"
            >

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Course ID</th>
                            <th>Course Name</th>
                            <th>Course Code</th>
                            <th>Department</th>
                            <th>Credits</th>
                            <th>Duration</th>
                            <th>Actions</th>
                        </tr>
                    </thead>

                    <tbody id="courseTable">
                        <tr>
                            <td colspan="7">Loading courses...</td>
                        </tr>
                    </tbody>
                </table>
            </div>

        </section>
    </main>
</div>


<!-- Add/Edit Course Modal -->

<div id="courseModal" class="modal">

    <div class="modal-content">

        <h2 id="modalTitle">Add Course</h2>

        <form id="courseForm">

            <input type="hidden" id="courseId">

            <label>Course Name</label>
            <input type="text" id="courseName" required>

            <label>Course Code</label>
            <input type="text" id="courseCode" required>

            <label>Department</label>
            <select id="courseDepartment" required>
                <option value="">Select Department</option>
                <option value="CSE">CSE</option>
                <option value="AIML">AIML</option>
                <option value="ECE">ECE</option>
                <option value="EEE">EEE</option>
                <option value="MECH">MECH</option>
                <option value="CIVIL">CIVIL</option>
            </select>

            <label>Credits</label>
            <input type="number" id="courseCredits" min="1" max="10" required>

            <label>Duration</label>
            <input type="text" id="courseDuration"
                   placeholder="Example: 6 Months" required>

            <div class="modal-actions">
                <button type="submit" class="btn-primary">Save Course</button>
                <button type="button" onclick="closeCourseForm()">
                    Cancel
                </button>
            </div>

        </form>

    </div>
</div>

<script src="../js/courses.js"></script>

</body>
</html>
